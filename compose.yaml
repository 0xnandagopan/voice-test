services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: v0
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-v0_local_only}
      POSTGRES_DB: v0
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v0 -d v0"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
